title: Site


tabs:

# TAB: DASHBOARD
  dashboard:
    label: Dashboard
    icon: dashboard
    columns:
      - width: 1/1
        sections:
          stats:
            type: stats
            size: small
            reports:
              - label: News
                value: "{{ site.find('news').children.listed.count }}"
                info: "Entwürfe: {{ site.find('news').drafts.count }}"
                link: /pages/news
              - label: Mitglieder
                value: "{{ site.find('about/members').children.listed.count }}"
                info: "Entwürfe: {{ site.find('about/members').drafts.count }}"
                link: /pages/about+members
              - label: Teams
                value: "{{ site.find('angebote/teams').children.listed.count }}"
                info: "Entwürfe: {{ site.find('angebote/teams').drafts.count }}"
                link: /pages/angebote+teams
              - label: Turniere
                value: "{{ site.find('tiger-turnier').children.listed.count }}"
                info: "Entwürfe: {{ site.find('tiger-turnier').drafts.count }}"
                link: /pages/tiger-turnier
      - width: 1/2
        sections:
          news:
            extends: sections/news
            layout: cardlets
            size: small
            limit: 8
      - width: 1/2
        sections:
          teams:
            extends: sections/teams
            layout: list
            limit: 6
          members:
            extends: sections/members
            layout: list
            limit: 6
          turniere:
            extends: sections/turniere
            layout: list
            limit: 4
            image:
              query: page.cover.toFile

# TAB: SITEMAP
  sitemap:
    label: Seitenbaum
    icon: sitemap
    columns:
      - width: 1/2
        sections:
          menupages:
            extends: sections/pages
            headline: Menü-Seiten
            status: listed
      - width: 1/2
        sections:
          functionpages:
            extends: sections/pages
            headline: Funktions-Seiten
            template:
              - home
              - news
              - imprint
              - privacy

            
# TAB: METADATEN
  meta:
    label: Metadaten
    icon: settings
    columns:
      - width: 1/2
        fields:
          meta:
            extends: fields/site-meta
          seo:
            extends: fields/site-seo
      - width: 1/2
        fields:
          links:
            extends: fields/site-links
