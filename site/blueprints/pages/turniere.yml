title: Turniere
icon: megaphone
options:
  delete: false


columns:

  - width: 1/2
    sections:
      listed:
        extends: sections/pages
        headline: Publizierte Turniere
        status:  listed
        layout: list
        image:
          query: page.cover.toFile ?? page.image
          cover: true
          ratio: 1/1
          back: white
        template: turnier
        sortBy: title desc

  - width: 1/2
    sections:
      drafts:
        extends: sections/pages
        headline: Entwürfe
        status: drafts
        layout: list
        image:
          query: page.cover.toFile ?? page.image
          cover: true
          ratio: 1/1
          back: white
        template: turnier
      unlisted:
        extends: sections/pages
        headline: Versteckte Turniere
        status: unlisted
        layout: list
        image:
          query: page.cover.toFile ?? page.image
          cover: true
          ratio: 1/1
          back: white
