title: DBV
icon: status-draft


tabs:
  # Tab Layout
  layout:
    label: Layout
    icon: page
    columns:
      - width: 2/3
        fields:
          schedules:
            type: structure
            label: Spielplan / -pläne
            fields:
              info:
                type: info
                theme: positive
                text: Bei "Liga" nur dann eine Auswahl treffen, wenn es mehr als eine in dieser Altersklasse gibt. Der "iFrame-Embed" ist der Code für den ensprechenden Spielplan von www.basketball-bund.net
              league:
                type: select
                label: Liga
                options:
                  - Oberliga
                  - Landesliga
                  - Bezirksliga
                  - Kreisliga
                  - JBBL
                  - Fortgeschrittene
                  - Anfänger
                  - Neulinge
              widgetNumber:
                extends: fields/widget-number
              widgetId:
                extends: fields/widget-id
          headline:
            type: text
            help: Nur ausfüllen, wenn Überschrift anders als Seitentitel.
          subheadline:
            type: text
            help: Optional.
          introtext:
            label: Introtext
            type: textarea
            help: Optionaler Einleitungstext
          text:
            type: textarea
      - width: 1/3
        fields:
          cover:
            extends: fields/cover
            image:
              ratio: 3/2
              cover: true
          gallery:
            label: Bilder-Galerie
            type: files
            max: 12
            size: full
            image:
              ratio: 1/1
              cover: true

  # Tab Uploads
  uploads:
    extends: layouts/uploads


