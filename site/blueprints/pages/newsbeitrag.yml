title: Newsbeitrag
num: '{{ page.date.toDate("Ymd") }}'
icon: 🗞️

tabs:
  # Tab Layout
  layout:
    label: Layout
    icon: page
    columns:

      - width: 2/3
        fields:
          intro:
            type: writer
            label: Intro-Text
            maxlength: 300
            help: optional
          text:
            type: textarea
          info:
            text: In Textboxen bitte die Überschrift-Hierarchien erst ab H2 verwenden. Die H1 ist für den Titel reserviert!
            theme: positive
            
      - width: 1/3
        fields:
          date:
            type: date
            label: Publiziert
            time: true
            default: now
            display: DD.MM.YYYY
          cover:
            type: files
            layout: cards
            max: 1
            size: full
            image:
              ratio: 2/1
              cover: true
              
  # Tab Uploads
  uploads:
    label: Alle Uploads
    icon: folder
    sections:
      images:
        type: files
        size: small
        layout: cards
        info: "{{ file.dimensions }} px"
        sortable: false
        sortBy: filename asc
        image:
          ratio: 1/1